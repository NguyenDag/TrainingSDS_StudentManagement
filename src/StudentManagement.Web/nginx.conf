server {
    listen 80;
    root /usr/share/nginx/html;

    # Publish already produced .gz next to each file; fall back to on-the-fly gzip for the rest.
    gzip_static on;
    gzip on;
    gzip_types application/wasm application/octet-stream application/javascript application/json text/css text/plain;

    # gRPC-Web calls (/studentmanagement.v1.StudentService/...) go to the server, same origin, so no CORS.
    location ~ ^/studentmanagement\.v1\. {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        # Server-streaming responses must reach the browser as they arrive.
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA routing: unknown paths (/students, /reports...) load index.html so F5 never 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The entry page and boot manifest must not be cached, or a redeploy keeps serving old assemblies.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /_framework/blazor.boot.json { add_header Cache-Control "no-cache"; }
}
