syntax = "proto3";

package studentmanagement.v1;

option csharp_namespace = "StudentManagement.Contracts.V1";

import "common.proto";
import "google/protobuf/empty.proto";

service TeacherService {
  rpc ListTeachers(ListTeachersRequest) returns (ListTeachersResponse);
  rpc GetTeacher(GetTeacherRequest) returns (Teacher);
  rpc CreateTeacher(CreateTeacherRequest) returns (Teacher);
  rpc UpdateTeacher(UpdateTeacherRequest) returns (Teacher);
  // FAILED_PRECONDITION while the teacher still has classrooms.
  rpc DeleteTeacher(DeleteTeacherRequest) returns (google.protobuf.Empty);
}

enum TeacherSortField {
  TEACHER_SORT_FIELD_UNSPECIFIED = 0; // treated as NAME
  TEACHER_SORT_FIELD_NAME = 1;
  TEACHER_SORT_FIELD_CODE = 2;
  TEACHER_SORT_FIELD_DATE_OF_BIRTH = 3;
}

message Teacher {
  int32 id = 1;
  string code = 2;
  string full_name = 3;
  Date date_of_birth = 4;
  int32 classroom_count = 5;
  int32 version = 6;
}

message ListTeachersRequest {
  int32 page = 1;
  int32 page_size = 2;
  TeacherSortField sort_by = 3;
  SortDirection direction = 4;
  // Matches a code prefix or part of the full name.
  optional string keyword = 5;
}

message ListTeachersResponse {
  repeated Teacher items = 1;
  PageInfo page_info = 2;
}

message GetTeacherRequest {
  int32 id = 1;
}

message CreateTeacherRequest {
  string code = 1;
  string full_name = 2;
  Date date_of_birth = 3;
}

message UpdateTeacherRequest {
  int32 id = 1;
  int32 version = 2;
  string code = 3;
  string full_name = 4;
  Date date_of_birth = 5;
}

message DeleteTeacherRequest {
  int32 id = 1;
}
