services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: studentmanagement
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: the temporary server that runs initdb scripts listens on the socket only,
      # so the container is not reported healthy until schema and seed are in place.
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d studentmanagement"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
